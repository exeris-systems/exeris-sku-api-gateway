# The per-repo footprint of ADR-085 §C.11. Every check it runs is defined in
# exeris-systems/.github; this file only says which gates apply here and how strictly.
#
# It runs the organisation's documentation, commit and pull-request gates on every pull request,
# and the review that composes them into one verdict.
#
# THIS FILE CARRIES `claude-code-action`, which refuses to start when the workflow it runs under
# differs in any byte from the copy on the default branch, and reports that refusal as a successful
# skip. A pull request that edits this file therefore gets no automated review, and its check goes
# green only through the `human-reviewed` label. Configuration that moves with the source tree
# belongs in a workflow file of its own, so that changing it does not switch the review off.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: adr-conventions rule 9 requires the `adr` label on a pull request
    # that amends an ADR, and the review is asked for with a label, so a label change has to re-run
    # the gates.
    #
    # `closed` is not a gate event and is here for one job: the judgement of ADR-087 §C.16, which
    # reads what the human did with the review once there is a history to read. Every other job
    # skips it explicitly — a gate on a pull request that can no longer merge decides nothing.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled, closed]
  # A person's approval is a human review (ADR-087 §B.8), and it has to reach the required check as
  # an event of its own: the check is read from the newest run on the head commit. `dismissed`,
  # because withdrawing an approval has to turn the check back. The model does not start on one.
  pull_request_review:
    types: [submitted, dismissed]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`. Publication removes the review label, and that removal is an `unlabeled` event whose
  # run would cancel the run still publishing, so bot-triggered runs queue. A close must not cancel
  # the run publishing the verdict it follows, and a review changes no diff, so neither has anything
  # newer to put in place of the run already working. Human pushes still collapse.
  cancel-in-progress: >-
    ${{ github.event.action != 'closed' && github.event_name != 'pull_request_review'
        && !endsWith(github.actor, '[bot]') }}
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares — not a wish list and not a minimum. Omitting a
# permission one of them declares does not run that job with less; it makes the whole file an
# invalid workflow. `id-token: write` and `issues: read` are review's: the OIDC exchange
# claude-code-action performs, and the debt issues that issue-conventions.md rule 6 says a review
# finding becomes. `actions: read` is judge's: the commit a review read is the reviewing run's own
# `head_sha`, which the platform states on the Actions API.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

# Referenced by branch, as the bundle's install instructions give it: exeris-systems/.github
# publishes no tags, so a commit SHA here would move only by hand, and a merge to that repository's
# `main` is a deployment to every caller.

jobs:
  docs:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      # strict: every documentation file in this repository passes as written, so ramp — fail only
      # on files the pull request touches — would shield no backlog and only let an untouched file
      # drift.
      mode: strict
      # The check enforces the required sections of pages typed `subsystem` or `module`; this
      # repository has none.
      section-check: false
  commits:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main
  pr-body:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main
  # The review of ADR-085 §J.33, published under the organisation's identity by ADR-087 §B.
  #
  # `needs` puts it after the gates it complements and `l1-results` hands it their conclusions:
  # the reviewer's harness denies the network, so a gate it is asked to read for itself lands in the
  # verdict as `not-run`. `always()`, because a review that vanishes from the checks when its gates
  # go red is the failure this arrangement exists to prevent. A bot's event runs the job too: the
  # required check is read from the newest run, the publishing half answers such an event from the
  # standing verdict, and the model does not start on one.
  #
  # THE REVIEW RUNS ON READINESS, not on every push: when the pull request is opened, marked ready
  # for review, or labelled `needs-review` by a person. A push afterwards leaves the standing
  # verdict covering an older commit, and the check says so until a review is asked for again.
  review:
    needs: [docs, commits, pr-body]
    if: ${{ always() && github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/review.yml@main
    with:
      # `review / verdict` is the check this adds, red when the verdict is BLOCKED,
      # absent, invalid, or resting on a mandatory gate that did not run. Making it a required
      # context is a branch-protection change, not a change to this file.
      publish: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      # This repository's own rules, applied after the shared routine's parts and under its
      # severity tags and verdict schema. Read at the BASE commit, never at the pull request's ref:
      # a pull request does not write the rules it is judged by.
      repo-routine: docs/repo-review-rules.md
      # One model run per part, composed into one verdict and one comment. `pr` runs on every pull
      # request; `docs`, `records`, `code-docs` and `code` where the diff has their files. A part
      # that leaves no verdict makes the check red.
      review-in-parts: true
    # Named, not `secrets: inherit`: the job needs these three and no other secret of this
    # repository.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
  # The judgement of ADR-087 §C.16, and the only job in this file that runs on `closed`. It is not a
  # gate — the pull request is closed and nothing it concludes can change what merged — and it
  # publishes no check and posts nothing. It judges captured rows, so while this repository does not
  # capture it finds none and writes nothing.
  judge:
    if: ${{ github.event.action == 'closed' }}
    uses: exeris-systems/.github/.github/workflows/judge-review.yml@main
    secrets:
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
