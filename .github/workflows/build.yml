name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the baseline the jar is compiled for (`maven.compiler.release` 25); 26 checks that the
        # sources still compile on the next JDK. Both rows produce class-file major 69.
        java: ['25', '26']

    steps:
      - name: Checkout exeris-sku-api-gateway
        uses: actions/checkout@v7
        with:
          path: exeris-sku-api-gateway

      # The composed capabilities are at 0.1.0-SNAPSHOT and published nowhere, so each is built from its
      # default branch; a change there can turn this build red. exeris-caps-service-boundary-core is a
      # test-scope dependency of gateway-core's build.
      - name: Checkout exeris-caps-service-boundary-core
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-service-boundary-core
          ref: main
          path: exeris-caps-service-boundary-core
      - name: Checkout exeris-caps-gateway-core
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-gateway-core
          ref: main
          path: exeris-caps-gateway-core
      - name: Checkout exeris-caps-request-routing
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-request-routing
          ref: main
          path: exeris-caps-request-routing
      - name: Checkout exeris-caps-upstream-pool
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-upstream-pool
          ref: main
          path: exeris-caps-upstream-pool
      - name: Checkout exeris-caps-circuit-breaker
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-circuit-breaker
          ref: main
          path: exeris-caps-circuit-breaker
      - name: Checkout exeris-caps-waf-rules
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-waf-rules
          ref: main
          path: exeris-caps-waf-rules
      - name: Checkout exeris-caps-gateway-observability
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-gateway-observability
          ref: main
          path: exeris-caps-gateway-observability
      - name: Checkout exeris-caps-cors-policy
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-cors-policy
          ref: main
          path: exeris-caps-cors-policy
      - name: Checkout exeris-caps-rate-limiting
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-rate-limiting
          ref: main
          path: exeris-caps-rate-limiting
      - name: Checkout exeris-caps-jwt-validation
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-jwt-validation
          ref: main
          path: exeris-caps-jwt-validation

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Two passes per capability, and the first is not redundant: exeris:generate runs at
      # generate-sources, but the processor writes the capability metadata it reads only during compile.
      # The order puts a capability after what its build needs.
      - name: Install the composed capabilities to the local repository (two passes each)
        run: |
          for cap in service-boundary-core gateway-core request-routing upstream-pool circuit-breaker waf-rules gateway-observability cors-policy rate-limiting jwt-validation;
          do
            (cd "exeris-caps-$cap" \
              && mvn -B -ntp compile -Dexeris.codegen.skip=true \
              && mvn -B -ntp -DskipTests install) || exit 1
          done

      # The process tests start the gateway, and the kernel refuses to boot a process that carries an
      # entitlement requirement without a licence manifest, in every environment. The organisation secret
      # holds a developer manifest; it is written outside the checkout so the tree stays as committed. A run
      # without the secret (a pull request from a fork) fails those tests with a message that says so.
      - name: Write the developer licence manifest
        env:
          EXERIS_DEV_LICENSE_MANIFEST: ${{ secrets.EXERIS_DEV_LICENSE_MANIFEST }}
        run: |
          if [ -n "${EXERIS_DEV_LICENSE_MANIFEST}" ]; then
            printf '%s' "${EXERIS_DEV_LICENSE_MANIFEST}" > "${RUNNER_TEMP}/license-manifest.json"
            echo "EXERIS_DEV_LICENSE_MANIFEST_PATH=${RUNNER_TEMP}/license-manifest.json" >> "${GITHUB_ENV}"
          fi

      - name: mvn verify
        working-directory: exeris-sku-api-gateway
        run: mvn -B -ntp verify

      # composition.json is generated by CompositionManifestTest's regeneration switch and compared by
      # the test, so a drift already fails verify; this step also catches a file the build added.
      - name: Assert the build left the tree as committed
        working-directory: exeris-sku-api-gateway
        run: |
          DRIFT=$(git status --porcelain --untracked-files=all -- composition.json)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            echo "::error::composition.json does not match the composed capabilities; regenerate it with -Dexeris.composition.regenerate=true and commit the result"
            exit 1
          fi

      - name: Build the container image
        if: matrix.java == '25'
        working-directory: exeris-sku-api-gateway
        run: docker build -t exeris-sku-api-gateway:ci .
